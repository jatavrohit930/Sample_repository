<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copilot Chat UI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">Copilot Chat</div>
    <div class="chat-box" id="chat-box"></div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
      <label class="icon-button">
        📷
        <input type="file" accept="image/*" capture="environment" onchange="handleCameraUpload(event)" hidden />
      </label>
      <label class="icon-button">
        🖼️
        <input type="file" accept="image/*" onchange="handleImageUpload(event)" hidden />
      </label>
      <label class="icon-button">
        📁
        <input type="file" onchange="handleFileUpload(event)" hidden />
      </label>
      
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
