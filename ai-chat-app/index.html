<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real AI Copilot Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      height: 90vh;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 25px;
      text-align: center;
      position: relative;
    }

    .chat-header h1 {
      font-size: 1.6em;
      margin-bottom: 5px;
    }

    .chat-header .subtitle {
      font-size: 0.85em;
      opacity: 0.9;
    }

    .status-indicator {
      position: absolute;
      top: 30px;
      right: 25px;
      width: 12px;
      height: 12px;
      background: #4caf50;
      border-radius: 50%;
      box-shadow: 0 0 10px #4caf50;
      animation: pulse-green 2s infinite;
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }

    .api-setup {
      background: linear-gradient(135deg, #fff9e6 0%, #fffaed 100%);
      padding: 20px;
      border-bottom: 3px solid #ffd700;
      animation: slide-down 0.5s ease;
    }

    @keyframes slide-down {
      from { transform: translateY(-100%); }
      to { transform: translateY(0); }
    }

    .api-setup h3 {
      margin-bottom: 10px;
      color: #333;
    }

    .api-setup input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #667eea;
      border-radius: 8px;
      font-size: 0.95em;
    }

    .api-setup button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
      transition: transform 0.2s;
    }

    .api-setup button:hover {
      transform: scale(1.02);
    }

    .api-setup a {
      display: block;
      margin-top: 10px;
      text-align: center;
      color: #667eea;
      text-decoration: none;
      font-size: 0.9em;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f5f7fa;
    }

    .chat-box::-webkit-scrollbar {
      width: 8px;
    }

    .chat-box::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    .chat-box::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 10px;
    }

    .chat-message {
      margin-bottom: 15px;
      padding: 14px 18px;
      border-radius: 18px;
      max-width: 75%;
      word-wrap: break-word;
      line-height: 1.5;
      animation: fadeIn 0.4s ease;
      position: relative;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user-message {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .bot-message {
      background: white;
      color: #333;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .system-message {
      background: #e8f5e9;
      color: #2e7d32;
      text-align: center;
      margin: 15px auto;
      max-width: 85%;
      border: 1px solid #4caf50;
    }

    .error-message {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef5350;
      text-align: center;
      margin: 15px auto;
      max-width: 85%;
    }

    .loading {
      background: #e3f2fd;
      color: #1976d2;
      font-style: italic;
      border-bottom-left-radius: 4px;
    }

    .loading::after {
      content: '...';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    .chat-input-area {
      display: flex;
      align-items: center;
      padding: 20px;
      border-top: 2px solid #e0e0e0;
      gap: 10px;
      background: white;
    }

    #chat-input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 25px;
      border: 2px solid #667eea;
      font-size: 1em;
      outline: none;
      transition: border-color 0.3s;
    }

    #chat-input:focus {
      border-color: #764ba2;
    }

    #send-btn {
      padding: 14px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      font-size: 1em;
    }

    #send-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    #send-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: scale(1);
    }

    .icon-button {
      cursor: pointer;
      font-size: 1.3em;
      padding: 8px;
      transition: transform 0.2s;
      display: inline-block;
      color: #667eea;
    }

    .icon-button:hover {
      transform: scale(1.2);
      color: #764ba2;
    }

    pre {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 10px 0;
    }

    code {
      background: #f5f5f5;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }

    .message-time {
      font-size: 0.75em;
      opacity: 0.7;
      margin-top: 5px;
    }

    .uploaded-image {
      max-width: 250px;
      border-radius: 12px;
      margin-top: 8px;
      display: block;
    }

    .image-preview {
      position: relative;
      display: inline-block;
      margin-top: 8px;
    }

    .remove-image {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255, 0, 0, 0.8);
      color: white;
      border: none;
      border-radius: 50%;
      width: 25px;
      height: 25px;
      cursor: pointer;
      font-size: 0.9em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-attached {
      background: #e3f2fd;
      padding: 8px 12px;
      border-radius: 8px;
      margin: 10px 0;
      display: inline-block;
      font-size: 0.9em;
      color: #1976d2;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1><i class="fa-solid fa-robot"></i> Real AI Copilot</h1>
      <div class="subtitle">Powered by Google Gemini AI - Now with Image Analysis! 📸</div>
      <span class="status-indicator" title="Connected"></span>
    </div>
    
    <div class="api-setup" id="api-setup">
      <h3>🔑 Setup Your AI</h3>
      <input 
        type="password" 
        id="api-key-input" 
        placeholder="Enter your Google AI API Key" 
      />
      <button onclick="saveApiKey()">✓ Connect & Start Chatting</button>
      <a href="https://aistudio.google.com/app/apikey" target="_blank">
        🔗 Get Free API Key from Google AI Studio
      </a>
    </div>

    <div class="chat-box" id="chat-box">
      <div class="chat-message system-message">
        👋 <strong>Welcome to Real AI Chat!</strong><br>
        <small>Enter your API key above to start chatting with real AI. You can now analyze images too! 📸</small>
      </div>
    </div>

    <div class="chat-input-area">
      <input 
        type="text" 
        id="chat-input" 
        placeholder="Type your message or upload an image..." 
        onkeypress="handleKeyPress(event)" 
        disabled 
      />
      <button onclick="sendMessage()" id="send-btn" disabled>Send</button>
      <label class="icon-button" title="Camera">
        <i class="fa-solid fa-camera"></i>
        <input type="file" accept="image/*" capture="environment" onchange="handleImageUpload(event)" hidden />
      </label>
      <label class="icon-button" title="Upload Image">
        <i class="fa-solid fa-image"></i>
        <input type="file" accept="image/*" onchange="handleImageUpload(event)" hidden />
      </label>
    </div>
  </div>

  <script>
    const SESSION_ID = 'session_' + Date.now();
    let API_KEY = null;
    let currentImage = null; // Store current image for sending

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      
      if (!key) {
        showError('Please enter an API key!');
        return;
      }

      if (key.length < 30) {
        showError('API key seems too short. Please check and try again.');
        return;
      }

      API_KEY = key;
      document.getElementById('api-setup').style.display = 'none';
      document.getElementById('chat-input').disabled = false;
      document.getElementById('send-btn').disabled = false;
      
      clearChat();
      appendMessage('System', '✅ <strong>Connected!</strong> Your AI assistant is ready. Ask me anything or upload images for analysis!', 'system-message');
      document.getElementById('chat-input').focus();
    }

    function clearChat() {
      document.getElementById('chat-box').innerHTML = '';
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const input = document.getElementById("chat-input");
      const message = input.value.trim();
      
      if (!message && !currentImage) return;
      
      if (!API_KEY) {
        showError('Please enter your API key first!');
        return;
      }

      // Display user message with image if attached
      let userMessageHTML = message || "Analyze this image";
      if (currentImage) {
        userMessageHTML += `<br><img src="${currentImage.dataUrl}" class="uploaded-image" />`;
      }
      appendMessage("You", userMessageHTML, 'user-message');
      input.value = "";

      const loadingId = appendMessage("AI", "Analyzing", 'bot-message loading');
      toggleInput(false);

      try {
        const requestBody = {
          message: message || "What's in this image?",
          sessionId: SESSION_ID,
          apiKey: API_KEY
        };

        // Add image data if present
        if (currentImage) {
          requestBody.image = {
            data: currentImage.base64,
            mimeType: currentImage.mimeType
          };
        }

        const response = await fetch('http://localhost:3000/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to get response');
        }

        removeMessage(loadingId);
        appendMessage("AI", formatResponse(data.response), 'bot-message');

        // Clear the current image after sending
        currentImage = null;

      } catch (error) {
        console.error('Error:', error);
        removeMessage(loadingId);
        
        let errorMsg = '❌ <strong>Error:</strong> ';
        if (error.message.includes('fetch') || error.message.includes('Failed to fetch')) {
          errorMsg += 'Cannot connect to server. Make sure the backend is running on port 3000. Run: npm start';
        } else if (error.message.includes('Invalid API Key')) {
          errorMsg += 'Invalid API Key. Please check your key and try again.';
        } else {
          errorMsg += error.message;
        }
        
        appendMessage("System", errorMsg, 'error-message');
      }

      toggleInput(true);
      document.getElementById('chat-input').focus();
    }

    function formatResponse(text) {
      text = text.replace(/```(\w+)?\n([\s\S]+?)```/g, '<pre><code>$2</code></pre>');
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\n/g, '<br>');
      return text;
    }

    function appendMessage(sender, text, className = 'bot-message') {
      const chatBox = document.getElementById("chat-box");
      const msg = document.createElement("div");
      msg.className = `chat-message ${className}`;
      msg.id = 'msg-' + Date.now() + '-' + Math.random();
      
      const time = new Date().toLocaleTimeString('en-IN', { 
        hour: '2-digit', 
        minute: '2-digit' 
      });
      
      if (sender === 'System') {
        msg.innerHTML = text;
      } else {
        msg.innerHTML = `<strong>${sender}:</strong> ${text}<div class="message-time">${time}</div>`;
      }
      
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg.id;
    }

    function removeMessage(messageId) {
      const msg = document.getElementById(messageId);
      if (msg) msg.remove();
    }

    function toggleInput(enabled) {
      document.getElementById('chat-input').disabled = !enabled;
      document.getElementById('send-btn').disabled = !enabled;
    }

    function showError(message) {
      appendMessage('System', `⚠️ ${message}`, 'error-message');
    }

    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Check file type
      if (!file.type.startsWith('image/')) {
        showError('Please upload a valid image file!');
        event.target.value = '';
        return;
      }

      // Check file size (max 4MB for Gemini API)
      if (file.size > 4 * 1024 * 1024) {
        showError('Image too large! Please upload an image smaller than 4MB.');
        event.target.value = '';
        return;
      }

      try {
        // Convert image to base64
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Data = e.target.result.split(',')[1]; // Remove data:image/...;base64, prefix
          const dataUrl = e.target.result;
          
          currentImage = {
            base64: base64Data,
            dataUrl: dataUrl,
            mimeType: file.type
          };

          // Show preview in input area
          appendMessage('System', `📸 <strong>Image uploaded!</strong> "${file.name}" - Type your question about this image or just click Send.`, 'system-message');
        };
        reader.readAsDataURL(file);
      } catch (error) {
        showError('Failed to process image: ' + error.message);
      }

      event.target.value = '';
    }

    function handleCameraUpload(event) {
      handleImageUpload(event);
    }
  </script>
</body>
</html>
